      <circle cx="16" cy="8" r="2" fill="none" stroke="currentColor" stroke-width="1.2"/>
      <path d="M8 12l-2 6" stroke="currentColor" stroke-width="1.2"/>
    </symbol>
    <symbol id="icon-galaxy" viewBox="0 0 24 24">
      <ellipse cx="12" cy="12" rx="10" ry="4" fill="none" stroke="currentColor" stroke-width="1" opacity=".5"/>
      <ellipse cx="12" cy="12" rx="4" ry="10" fill="none" stroke="currentColor" stroke-width="1" opacity=".5"/>
      <circle cx="12" cy="12" r="2" fill="currentColor"/>
      <circle cx="7" cy="8" r=".8" fill="currentColor" opacity=".6"/>
      <circle cx="17" cy="16" r=".8" fill="currentColor" opacity=".6"/>
    </symbol>
    <symbol id="icon-star" viewBox="0 0 24 24">
      <path d="M12 2l2.5 7.5H22l-6 4.5 2.5 7.5L12 17l-6.5 4.5L8 14 2 9.5h7.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-planet" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <ellipse cx="12" cy="12" rx="11" ry="3" fill="none" stroke="currentColor" stroke-width="1" opacity=".5" transform="rotate(-20 12 12)"/>
    </symbol>
    <symbol id="icon-neutron-star" viewBox="0 0 24 24">
