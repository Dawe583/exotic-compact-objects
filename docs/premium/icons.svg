      </path>
    </symbol>
    <symbol id="icon-verified" viewBox="0 0 24 24">
      <path d="M12 2l2.5 1.5 3-.5 1.5 2.5 3 1.5-1 3 1 3-3 1.5-1.5 2.5-3-.5L12 22l-2.5-1.5-3 .5-1.5-2.5-3-1.5 1-3-1-3 3-1.5 1.5-2.5 3 .5z" fill="none" stroke="currentColor" stroke-width="1.2"/>
      <path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </symbol>
