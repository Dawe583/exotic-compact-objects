<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="display:none">
  <defs>
    <!-- Physics icons -->
    <symbol id="icon-black-hole" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 2" opacity=".6"/>
      <circle cx="12" cy="12" r="1" fill="currentColor"/>
      <path d="M12 2v4M12 18v4M2 12h4M18 12h4" stroke="currentColor" stroke-width=".8" opacity=".4"/>
    </symbol>
    <symbol id="icon-orbit" viewBox="0 0 24 24">
      <ellipse cx="12" cy="12" rx="10" ry="4" fill="none" stroke="currentColor" stroke-width="1.5" transform="rotate(-30 12 12)"/>
      <circle cx="12" cy="12" r="2" fill="currentColor"/>
      <circle cx="20" cy="9" r="1.5" fill="currentColor" opacity=".7"/>
    </symbol>
    <symbol id="icon-wave" viewBox="0 0 24 24">
      <path d="M2 12c2-4 4-4 6 0s4 4 6 0 4-4 6 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-atom" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="2" fill="currentColor"/>
      <ellipse cx="12" cy="12" rx="10" ry="4" fill="none" stroke="currentColor" stroke-width="1"/>
      <ellipse cx="12" cy="12" rx="10" ry="4" fill="none" stroke="currentColor" stroke-width="1" transform="rotate(60 12 12)"/>
      <ellipse cx="12" cy="12" rx="10" ry="4" fill="none" stroke="currentColor" stroke-width="1" transform="rotate(120 12 12)"/>
    </symbol>
    <symbol id="icon-telescope" viewBox="0 0 24 24">
