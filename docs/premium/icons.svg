      <circle cx="12" cy="12" r="2" fill="currentColor"/>
    </symbol>
    <symbol id="icon-metric" viewBox="0 0 24 24">
      <text x="4" y="16" font-family="serif" font-size="14" font-style="italic" fill="currentColor">g</text>
      <text x="14" y="10" font-family="serif" font-size="8" fill="currentColor" opacity=".7">μν</text>
    </symbol>
    <symbol id="icon-tensor" viewBox="0 0 24 24">
      <text x="5" y="17" font-family="serif" font-size="14" font-style="italic" fill="currentColor">T</text>
      <text x="14" y="10" font-family="serif" font-size="8" fill="currentColor" opacity=".7">μν</text>
    </symbol>
    <symbol id="icon-integral" viewBox="0 0 24 24">
      <text x="6" y="19" font-family="serif" font-size="20" fill="currentColor">∫</text>
    </symbol>
    <symbol id="icon-derivative" viewBox="0 0 24 24">
      <text x="4" y="18" font-family="serif" font-size="18" font-style="italic" fill="currentColor">∂</text>
    </symbol>

